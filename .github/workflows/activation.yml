name: Создать файл активации Unity

on:
  workflow_dispatch: {}

jobs:
  activation:
    name: Generate .alf
    runs-on: ubuntu-latest
    steps:
      - name: Activate personal license (legacy username/password)
        env:
          UE: ${{ secrets.UNITY_EMAIL }}
          UP: ${{ secrets.UNITY_PASSWORD }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/alf-out"
          docker run --rm \
            -v "$GITHUB_WORKSPACE/alf-out":/alf-out \
            -e HOME=/alf-out \
            -e UE -e UP \
            unityci/editor:ubuntu-6000.0.23f1-base-3 \
            /bin/bash -lc 'unity-editor -batchmode -nographics -username "$UE" -password "$UP" -logfile - || true; find / -name "*.ulf" -exec cp -v {} /alf-out/ \; 2>/dev/null || true'
          find "$GITHUB_WORKSPACE/alf-out" -name "*.ulf" -exec ls -la {} \;
      - uses: actions/upload-artifact@v4
        with:
          name: Manual Activation File (.alf)
          path: alf-out